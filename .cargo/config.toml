[build]
jobs = 8

[target.armv7-sony-vita-newlibeabihf]
rustflags = [
    "-C", "target-cpu=cortex-a9",
    "-C", "link-arg=-Wl,--defsym=__sce_headroom=0x10000",
    "-C", "codegen-units=1",
    "-C", "lto=fat",
    "-C", "opt-level=s",
]

[target.arm-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
rustflags = [
    "-C", "target-cpu=arm1176jzf-s",
    "-C", "link-arg=-latomic",
]

[target.x86_64-unknown-freebsd]
rustflags = [
    "-L", "/usr/local/lib",
    "-C", "link-arg=-Wl,-rpath,/usr/local/lib",
]

[target.powerpc-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "target-cpu=ppc",
    "-C", "link-arg=--target=powerpc-unknown-linux-gnu",
    "-C", "link-arg=-fuse-ld=lld",
]
