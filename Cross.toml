[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install --assume-yes libudev-dev:arm64 libasound2-dev:arm64 libx11-dev:arm64",
]

