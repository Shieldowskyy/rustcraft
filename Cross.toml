[target.x86_64-unknown-freebsd]
pre-build = [
    "mkdir -p /usr/local/libdata/pkgconfig",
    "printf 'prefix=/usr/local\\nName: libudev\\nDescription: libudev\\nVersion: 243\\nLibs:\\nCflags:\\n' > /usr/local/libdata/pkgconfig/libudev.pc",
]

[target.x86_64-unknown-freebsd.env]
passthrough = [
    "RUSTFLAGS",
    "PKG_CONFIG_PATH=/usr/local/libdata/pkgconfig:/usr/local/lib/pkgconfig",
    "PKG_CONFIG_ALLOW_CROSS=1",
]

