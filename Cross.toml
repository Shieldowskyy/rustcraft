[target.arm-unknown-linux-gnueabihf]
pre-build = [
    "rm -f /etc/apt/preferences.d/*",
    "dpkg --add-architecture armhf",
    "apt-get update",
    "apt-get install --assume-yes --no-install-recommends libudev-dev:armhf libasound2-dev:armhf libx11-dev:armhf",
]

[target.arm-unknown-linux-gnueabihf.env]
passthrough = [
    "RUSTFLAGS",
    "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig",
    "PKG_CONFIG_ALLOW_CROSS=1",
]

[target.riscv64gc-unknown-linux-gnu]
pre-build = [
    "mkdir -p /usr/local/lib/pkgconfig /tmp/udev_stub",
    "printf '#include <stddef.h>\\nvoid* udev_new(void){return NULL;}\\nvoid* udev_unref(void* u){return NULL;}\\nvoid* udev_device_new_from_syspath(void* u,const char* s){return NULL;}\\nvoid* udev_device_unref(void* d){return NULL;}\\nconst char* udev_device_get_devnode(void* d){return NULL;}\\nconst char* udev_device_get_syspath(void* d){return NULL;}\\nconst char* udev_device_get_property_value(void* d,const char* k){return NULL;}\\nconst char* udev_device_get_action(void* d){return NULL;}\\nvoid* udev_enumerate_new(void* u){return NULL;}\\nvoid* udev_enumerate_unref(void* e){return NULL;}\\nint udev_enumerate_add_match_subsystem(void* e,const char* s){return 0;}\\nint udev_enumerate_add_match_property(void* e,const char* p,const char* v){return 0;}\\nint udev_enumerate_add_match_tag(void* e,const char* t){return 0;}\\nint udev_enumerate_add_match_is_initialized(void* e){return 0;}\\nint udev_enumerate_add_match_sysname(void* e,const char* s){return 0;}\\nint udev_enumerate_scan_devices(void* e){return 0;}\\nvoid* udev_enumerate_get_list_entry(void* e){return NULL;}\\nvoid* udev_list_entry_get_next(void* l){return NULL;}\\nconst char* udev_list_entry_get_name(void* l){return NULL;}\\nvoid* udev_monitor_new_from_netlink(void* u,const char* n){return NULL;}\\nvoid* udev_monitor_unref(void* m){return NULL;}\\nint udev_monitor_enable_receiving(void* m){return 0;}\\nint udev_monitor_get_fd(void* m){return -1;}\\nvoid* udev_monitor_receive_device(void* m){return NULL;}\\nint udev_monitor_filter_add_match_subsystem_devtype(void* m,const char* s,const char* d){return 0;}\\n' > /tmp/udev_stub/udev.c",
    "riscv64-linux-gnu-gcc -shared -fPIC /tmp/udev_stub/udev.c -o /usr/riscv64-linux-gnu/lib/libudev.so",
    "printf 'Name: libudev\\nDescription: libudev stub\\nVersion: 245\\nLibs: -ludev\\nCflags:\\n' > /usr/local/lib/pkgconfig/libudev.pc",
    "printf 'Name: alsa\\nDescription: alsa stub\\nVersion: 1.2.2\\nLibs:\\nCflags:\\n' > /usr/local/lib/pkgconfig/alsa.pc",
    "printf 'Name: x11\\nDescription: x11 stub\\nVersion: 1.6.9\\nLibs:\\nCflags:\\n' > /usr/local/lib/pkgconfig/x11.pc",
]

[target.riscv64gc-unknown-linux-gnu.env]
passthrough = [
    "RUSTFLAGS",
    "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig",
    "PKG_CONFIG_ALLOW_CROSS=1",
]

[target.i686-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture i386",
    "apt-get update",
    "apt-get install --assume-yes libudev-dev:i386 libasound2-dev:i386 libx11-dev:i386",
]

[target.i686-unknown-linux-gnu.env]
passthrough = [
    "RUSTFLAGS",
