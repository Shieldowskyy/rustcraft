[build.env]
passthrough = ["RUSTFLAGS"]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install --assume-yes libudev-dev:arm64 libasound2-dev:arm64 libx11-dev:arm64",
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig",
    "PKG_CONFIG_ALLOW_CROSS=1",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture armhf",
    "apt-get update",
    "apt-get install --assume-yes libudev-dev:armhf libasound2-dev:armhf libx11-dev:armhf",
]

[target.armv7-unknown-linux-gnueabihf.env]
passthrough = [
    "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig",
    "PKG_CONFIG_ALLOW_CROSS=1",
]

# RPi Zero W (ARMv6).
# Uses a newer image (glibc >= 2.25, needed by the sysroot's libudev) and pulls
# armhf packages from ports.ubuntu.com, since archive.ubuntu.com only hosts
# amd64/i386. Instead of patching the image's existing apt sources, we move them
# aside and write one explicit deb822 file:
#   amd64 -> archive.ubuntu.com, armhf -> ports.ubuntu.com
# This avoids "configured multiple times" warnings and missing armhf indexes.
[target.arm-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/arm-unknown-linux-gnueabihf:main"
pre-build = [
    "dpkg --add-architecture armhf",
    "mkdir -p /etc/apt/disabled",
    "mv /etc/apt/sources.list /etc/apt/disabled/ 2>/dev/null || true",
    "mv /etc/apt/sources.list.d/* /etc/apt/disabled/ 2>/dev/null || true",
    # amd64 block: host packages (compiler, pkg-config, ...)
    ". /etc/os-release && printf 'Types: deb\\nURIs: http://archive.ubuntu.com/ubuntu\\nSuites: %s %s-updates %s-security\\nComponents: main universe\\nArchitectures: amd64\\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\\n\\n' \"$VERSION_CODENAME\" \"$VERSION_CODENAME\" \"$VERSION_CODENAME\" > /etc/apt/sources.list.d/cross.sources",
    # armhf block: target libraries (libudev, alsa, x11)
    ". /etc/os-release && printf 'Types: deb\\nURIs: http://ports.ubuntu.com/ubuntu-ports\\nSuites: %s %s-updates %s-security\\nComponents: main universe\\nArchitectures: armhf\\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\\n' \"$VERSION_CODENAME\" \"$VERSION_CODENAME\" \"$VERSION_CODENAME\" >> /etc/apt/sources.list.d/cross.sources",
    # print the result so it shows up in the CI log for debugging
    "cat /etc/apt/sources.list.d/cross.sources",
    "apt-get update",
    "apt-get install --assume-yes libudev-dev:armhf libasound2-dev:armhf libx11-dev:armhf",
]

[target.arm-unknown-linux-gnueabihf.env]
passthrough = [
    "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig",
    "PKG_CONFIG_ALLOW_CROSS=1",
]

[target.riscv64gc-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture riscv64",
    "apt-get update",
    "apt-get install --assume-yes libudev-dev:riscv64 libasound2-dev:riscv64 libx11-dev:riscv64",
]

[target.riscv64gc-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_PATH=/usr/lib/riscv64-linux-gnu/pkgconfig",
    "PKG_CONFIG_ALLOW_CROSS=1",
]

[target.i686-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture i386",
    "apt-get update",
    "apt-get install --assume-yes libudev-dev:i386 libasound2-dev:i386 libx11-dev:i386",
]

[target.i686-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig",
    "PKG_CONFIG_ALLOW_CROSS=1",
]
