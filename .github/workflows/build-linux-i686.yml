name: Build Linux 32-bit

on:
  push:
    branches: [ "main", "refactor/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-i686:
    name: Build Linux 32-bit (i686)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies & multilib
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            libx11-dev:i386 \
            libasound2-dev:i386 \
            libudev-dev:i386 \
            pkg-config

      - name: Install Rust Stable with i686 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu

      - name: Build and Strip Linux 32-bit Binary
        run: |
          chmod +x scripts/build_linux_x86_32.sh
          ./scripts/build_linux_x86_32.sh

      - name: Upload Linux 32-bit Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustCraft-Linux-i686
          path: target/i686-unknown-linux-gnu/release/rustcraft
          if-no-files-found: error
