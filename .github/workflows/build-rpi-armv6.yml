name: Build Raspberry Pi ARMv6

on:
  push:
    branches: [ "main", "refactor/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rpi-armv6:
    name: Build RPi Zero W (ARMv6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies & cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            pkg-config

      - name: Install Rust Stable with ARM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: arm-unknown-linux-gnueabihf

      - name: Install Cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin

      - name: Build and Strip Raspberry Pi ARMv6 Binary
        run: |
          chmod +x scripts/build_rpi_armv6.sh
          ./scripts/build_rpi_armv6.sh

      - name: Upload Raspberry Pi ARMv6 Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustCraft-RPi-ZeroW-ARMv6
          path: target/arm-unknown-linux-gnueabihf/release/rustcraft
          if-no-files-found: error
