name: Build Linux RISC-V 64

on:
  push:
    branches: [ "main", "refactor/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-riscv64:
    name: Build Linux RISC-V 64 (riscv64gc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies & cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            pkg-config

      - name: Install Rust Stable with RISC-V 64 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: riscv64gc-unknown-linux-gnu

      - name: Install Cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin

      - name: Build and Strip Linux RISC-V 64 Binary
        run: |
          chmod +x scripts/build_linux_riscv64.sh
          ./scripts/build_linux_riscv64.sh

      - name: Upload Linux RISC-V 64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustCraft-Linux-RISCV64
          path: target/riscv64gc-unknown-linux-gnu/release/rustcraft
          if-no-files-found: error
