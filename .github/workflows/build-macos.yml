name: Build macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (Universal 2: Apple Silicon & Intel)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Run Tests
        run: cargo test --release --verbose

      - name: Build macOS Universal Binary & App Bundle
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh universal

      - name: Upload macOS App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustCraft-macOS-Universal
          path: dist/RustCraft.app
          if-no-files-found: error

      - name: Upload macOS Distribution Archive
        uses: actions/upload-artifact@v4
        with:
          name: RustCraft-macOS-Universal-tar
          path: dist/rustcraft-macos-universal.tar.gz
          if-no-files-found: error
