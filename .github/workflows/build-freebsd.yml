name: Build FreeBSD

on:
  push:
    branches: [ "main", "refactor/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-freebsd:
    name: Build FreeBSD x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.1"
          usesh: true
          prepare: |
            pkg install -y rust libX11 libXcursor libXrandr libXi libXinerama libXext libXfixes alsa-lib pkgconf libudev-devd xorgproto libxkbcommon wayland
            [ -f /usr/local/bin/pkg-config ] || ln -sf /usr/local/bin/pkgconf /usr/local/bin/pkg-config
          run: |
            export PATH="/usr/local/bin:${HOME}/.cargo/bin:${PATH:-/usr/bin:/bin}"
            chmod +x scripts/build_freebsd.sh
            ./scripts/build_freebsd.sh

      - name: Upload FreeBSD Binary
        uses: actions/upload-artifact@v4
        with:
          name: RustCraft-FreeBSD-x86_64
          path: target/release/rustcraft
          if-no-files-found: error
