# Minecraft Server Properties for RustCraft Dedicated Server
# You can edit these values to customize your multiplayer server.
# Run the server in terminal using: cargo run --release -- --server

# TCP network port the server listens on (default: 26656)
server-port=26656

# World generation seed (number, or 0 for random seed)
level-seed=133742

# Message of the Day displayed in chat upon joining
motd=Welcome to RustCraft Dedicated Server!

# Maximum number of concurrent players allowed
max-players=20

# Player vs Player combat enabled
pvp=true

# Game mode: survival or creative
gamemode=survival

# Difficulty setting: peaceful, easy, normal, hard
difficulty=normal

# Server-side view distance in chunks
view-distance=8

# World spawn coordinates (X, Y, Z)
spawn-x=8.5
spawn-y=65.0
spawn-z=8.5
