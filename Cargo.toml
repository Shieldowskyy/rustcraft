[package]
name = "rustcraft"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustcraft"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "rustcraft"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
getrandom = { version = "=0.2.15", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.27"
raw-window-handle = "0.6"
wgpu = "0.19"
pollster = "0.3"
rayon = "1.8"
gilrs = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "Performance",
    "console"
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[profile.release]
opt-level = "s"      # Optymalizacja pod kątem małego rozmiaru (lub "z")
lto = true           # Link Time Optimization włączone w pełni dla mniejszego kodu
codegen-units = 1    # Jedna jednostka generacji kodu (maksymalna optymalizacja rozmiaru/wyszukiwanie martwego kodu)
panic = "abort"      # Usuwa kod obsługi unwindingu (stack unrolling), oszczędza sporo KB
strip = true         # Automatycznie usuwa symbole debugowania po kompilacji

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

