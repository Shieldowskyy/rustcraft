[package]
name = "rustcraft"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustcraft"
# NOTE: Having "cdylib" and "staticlib" here forces Cargo to link the entire engine 3 times!
# For fast local PC builds, temporarily change this to: crate-type = ["rlib"]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "rustcraft"
path = "src/main.rs"

[features]
default = []
profiler = []
xbox360 = []
autotest = []

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
getrandom = { version = "=0.2.15", features = ["js", "custom"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
lewton = "0.10.2"
opus-pure = "0.2.2"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "vita")))'.dependencies]
rayon = "1.8"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_arch = "powerpc"), not(target_os = "vita"), not(target_os = "xbox360"), not(target_os = "xenon")))'.dependencies]
wgpu = "0.19"
pollster = "0.3"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_arch = "powerpc"), not(target_os = "vita"), not(target_os = "android"), not(target_os = "xbox360"), not(target_os = "xenon")))'.dependencies]
minifb = "0.27"
raw-window-handle = "0.6"
gilrs = "0.11"
sentry = "0.49"

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "=0.3.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "Performance",
    "console",
    "AudioContext"
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_arch = "powerpc")))'.dependencies]
x11-dl = "2.21"

# --- BUILD PROFILES ---

# Optimize dependencies in dev mode for high FPS while keeping rustcraft compile times minimal
[profile.dev]
opt-level = 1               # Basic optimizations for rustcraft code to keep incremental builds fast
incremental = true          # Cache compiled modules to avoid rebuilding the entire crate

[profile.dev.package."*"]
opt-level = 3               # Compile all third-party libraries (wgpu, flate2, opus) at full speed once

# Fast release profile optimized for rapid iteration on the final lib and bin stages
[profile.release]
opt-level = 2               # Near-maximum runtime speed, but significantly faster LLVM passes than level 3
lto = "off"                 # Disable LTO to avoid expensive whole-program linking across cdylib/staticlib/bin
codegen-units = 256         # Maximize parallel LLVM code generation for the rustcraft crate
incremental = true          # Cache unchanged rustcraft modules across release builds
panic = "abort"             # Abort on panic to remove unwinding overhead
strip = false               # Keep symbols for elf conversions and debugging tools

# Keep all third-party dependencies at maximum optimization level in release mode
[profile.release.package."*"]
opt-level = 3               # Dependencies are only built once, so optimize them aggressively

# Full distribution profile for final shipping builds (run with: cargo build --profile dist)
[profile.dist]
inherits = "release"
opt-level = 3               # Maximum runtime execution performance
lto = "thin"                # Multi-threaded ThinLTO for final production binaries
codegen-units = 16          # Fewer codegen units for better cross-module optimization
incremental = false         # Clean non-incremental optimization pass for release distribution

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.vita]
title_id = "RUSTCRAFT"
title_name = "RustCraft"
assets = "vita/sce_sys"

[package.metadata.xbox360]
title_id = "58580864"
title_name = "RustCraft"
media_id = "00000000"
version = "1.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("vita", "xbox360", "xenon"))'] }