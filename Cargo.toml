[package]
name = "rustcraft"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustcraft"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "rustcraft"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
getrandom = { version = "=0.2.15", features = ["js"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "vita")))'.dependencies]
minifb = "0.27"
raw-window-handle = "0.6"
wgpu = "0.19"
pollster = "0.3"
rayon = "1.8"
gilrs = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "Performance",
    "console"
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[profile.release]
opt-level = "s"      # Optimize for binary size (or "z")
lto = true           # Full Link Time Optimization for smaller binary footprint
codegen-units = 1    # Single codegen unit for maximum size optimization and dead code elimination
panic = "abort"      # Abort on panic to remove stack unwinding code, saving space
strip = false        # Keep symbols for Vita elf conversion and relocation tools (-q)

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.vita]
title_id = "RUSTCRAFT"
title_name = "RustCraft"
assets = "vita/sce_sys"


