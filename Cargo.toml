[package]
name = "rustcraft"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustcraft"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "rustcraft"
path = "src/main.rs"

[features]
default = []
profiler = []
xbox360 = []
autotest = []

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
getrandom = { version = "=0.2.15", features = ["js", "custom"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "vita")))'.dependencies]
rayon = "1.8"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_arch = "powerpc"), not(target_os = "vita"), not(target_os = "android"), not(target_os = "xbox360"), not(target_os = "xenon")))'.dependencies]
minifb = "0.27"
raw-window-handle = "0.6"
wgpu = "0.19"
pollster = "0.3"
gilrs = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "=0.3.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "Performance",
    "console"
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_arch = "powerpc")))'.dependencies]
x11-dl = "2.21"

[profile.release]
opt-level = 3          # Maximum runtime execution performance
lto = "thin"           # Multi-threaded ThinLTO parallelized across CPU cores
codegen-units = 16     # Multi-threaded code generation for fast builds
panic = "abort"        # Abort on panic to remove unwinding overhead
strip = false          # Keep symbols for elf conversions and debugging tools

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.vita]
title_id = "RUSTCRAFT"
title_name = "RustCraft"
assets = "vita/sce_sys"

[package.metadata.xbox360]
title_id = "58580864"
title_name = "RustCraft"
media_id = "00000000"
version = "1.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("vita", "xbox360", "xenon"))'] }


