[package]
name = "rustcraft"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustcraft"
path = "src/main.rs"

[dependencies]
minifb = "0.27"
raw-window-handle = "0.6"
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
getrandom = "=0.2.15"
rayon = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[profile.release]
opt-level = "s"      # Optymalizacja pod kątem małego rozmiaru (lub "z")
lto = true           # Link Time Optimization włączone w pełni dla mniejszego kodu
codegen-units = 1    # Jedna jednostka generacji kodu (maksymalna optymalizacja rozmiaru/wyszukiwanie martwego kodu)
panic = "abort"      # Usuwa kod obsługi unwindingu (stack unrolling), oszczędza sporo KB
strip = true         # Automatycznie usuwa symbole debugowania po kompilacji
