[package]
name = "rustcraft"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustcraft"
path = "src/main.rs"

[dependencies]
minifb = "0.27"
raw-window-handle = "0.6"
# Pinned transitive dependency: newer getrandom releases require the
# "edition2024" Cargo feature, which is only available on much newer
# cargo/rustc toolchains. Pinning keeps this project buildable on older
# stable toolchains (e.g. distro-packaged Rust 1.75+) as well as the latest.
getrandom = "=0.2.15"

# X11 pointer grab/warp support, used on Linux to truly lock and hide the
# mouse cursor inside the game window (real FPS-style mouse capture). Only
# compiled on Linux; other platforms fall back to a delta-tracking cursor.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
